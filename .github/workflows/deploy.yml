name: Publicar

# Se publica en cada cambio y también cada 3 horas, para renovar la previsión del tiempo.
on:
  push:
    branches: [main]
  schedule:
    - cron: '7 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Previsión del tiempo (3 modelos, rejilla de 0,1°)
        # Si Open-Meteo falla, la app sigue funcionando: pide la previsión directamente.
        continue-on-error: true
        run: node scripts/build-forecast.mjs
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
